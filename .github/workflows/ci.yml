name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install ruff==0.12.11
      - run: ruff check . --output-format=concise

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install ruff==0.12.11
      - run: ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - name: End-to-end smoke test
        run: |
          reliability-lab run --source data/events.jsonl --db artifacts/lab.db
          reliability-lab report --db artifacts/lab.db --output artifacts/report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/report.json").read_text())
          assert report["rows"] == {
              "input": 3,
              "pending_replay": 1,
              "quarantined": 1,
          }
          assert report["runs"] == {"failed": 0, "total": 1}
          assert report["slo"] == {
              "actual": 1 / 3,
              "met": False,
              "name": "quarantine_ratio",
              "target_max": 0.05,
          }
          PY
      - name: Upload reliability report
        uses: actions/upload-artifact@v7
        with:
          name: reliability-report-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/report.json
          if-no-files-found: error
          retention-days: 14
