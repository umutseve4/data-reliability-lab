name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and quality tools
        run: python -m pip install --upgrade pip && python -m pip install -e . ruff
      - name: Lint and format gate
        run: ruff check . && ruff format --check .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: End-to-end smoke test
        run: |
          reliability-lab run --source data/events.jsonl --db artifacts/lab.db
          reliability-lab report --db artifacts/lab.db --output artifacts/report.json
          test -s artifacts/report.json
      - name: Upload reliability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-report-py${{ matrix.python-version }}
          path: artifacts/report.json
          if-no-files-found: warn
          retention-days: 14
