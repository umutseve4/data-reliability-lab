name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install ruff==0.12.11
      - run: ruff check . --output-format=concise

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install ruff==0.12.11
      - run: ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - name: End-to-end smoke test
        run: |
          reliability-lab run --source data/events.jsonl --db artifacts/lab.db
          reliability-lab report --db artifacts/lab.db --output artifacts/report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/report.json").read_text())
          assert report["rows"] == {
              "input": 3,
              "pending_replay": 1,
              "quarantined": 1,
          }
          assert report["runs"] == {"failed": 0, "total": 1}
          assert report["slo"] == {
              "actual": 1 / 3,
              "met": False,
              "name": "quarantine_ratio",
              "target_max": 0.05,
          }
          PY
      - name: Upload reliability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reliability-report-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/report.json
          if-no-files-found: error
          retention-days: 14

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build container image
        run: docker build --tag data-reliability-lab:ci .
      - name: Run container and verify ingestion summary
        run: |
          docker run --rm data-reliability-lab:ci > container-result.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("container-result.json").read_text())
          assert result["input_rows"] == 3
          assert result["accepted_rows"] == 2
          assert result["duplicate_rows"] == 0
          assert result["quarantined_rows"] == 1
          PY
