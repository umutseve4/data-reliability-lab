name: Ruff Autofix

on:
  push:
    branches:
      - verify/initial-ci

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out verification branch
        uses: actions/checkout@v4
        with:
          ref: verify/initial-ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.12.11

      - name: Apply safe lint fixes and formatting
        run: |
          ruff check --fix .
          ruff format .

      - name: Commit generated fixes
        run: |
          if git diff --quiet; then
            echo 'RUFF_AUTOFIX=NO_CHANGES'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'chore: apply Ruff autofixes'
          git push origin HEAD:verify/initial-ci
