name: Ruff Diagnostics

on:
  push:
    branches:
      - verify/initial-ci

permissions:
  contents: write

jobs:
  diagnostics:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/initial-ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check ruff==0.12.11
      - name: Persist exact diagnostics
        run: |
          ruff check --output-format=concise . > ruff-diagnostics.txt || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ruff-diagnostics.txt
          git commit -m 'chore: capture Ruff diagnostics'
          git push origin HEAD:verify/initial-ci
